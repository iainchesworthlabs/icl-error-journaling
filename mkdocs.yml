site_name: CS Bingo Board
site_description: An app for logging robot session errors through the day and sharing the log
repo_url: https://github.com/iainchesworthlabs/icl-error-journaling
# Where the guide, support and privacy pages are published; store/appstore/en-GB/*_url.txt hold the same paths.
site_url: https://iainchesworthlabs.github.io/icl-error-journaling/
docs_dir: docs
# The outline of the guide is a working page for contributors, not for the site (docs/plan/stage-10.md).
exclude_docs: |
  guide/outline.md
  guide/screenshots.json
strict: true
# Publishes config/sample-config.json as demo/demo-setup.ejconfig for App Review and new users (docs/plan/stage-11.md).
hooks:
  - tools/docs/demo_setup_hook.py
markdown_extensions:
  - attr_list  # sets the width of the guide's pictures: ![alt](img/x.png){ width="270" }
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - User guide:
      - Getting started: guide/getting-started.md
      - Setting up the board: guide/setup.md
      - A day of logging: guide/logging.md
      - Today's details: guide/todays-details.md
      - Sharing and the next day: guide/sharing.md
      - History: guide/history.md
      - The setup file: guide/setup-file.md
  - Support: support.md
  - Privacy: privacy.md
  - For developers: developers.md
  - Requirements (PRD): prd.md
  - Implementation plan: implementation-plan.md
  - Plan:
      - Bootstrap: design/bootstrap-plan.md
      - Stage 0: plan/stage-0.md
      - Stage 0 spikes: plan/spikes.md
      - Stage 4: plan/stage-4.md
      - Stage 7: plan/stage-7.md
      - Stage 10 (documentation): plan/stage-10.md
      - Stage 8 (iPad): plan/stage-8.md
      - Stage 9: plan/stage-9.md
      - Stage 12 (desktop, v2): plan/stage-12.md
      - Stage 13 (foldables): plan/stage-13.md
      - About page: plan/about-page.md
  - Design: design/README.md
  - Building: building.md
  - Architecture: architecture.md
  - Licences and the About page: licensing.md
  - Testing: testing.md
  - Continuous integration: ci.md
  - Releasing: releasing.md
