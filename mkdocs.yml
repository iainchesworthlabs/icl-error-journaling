site_name: Field Test
site_description: An app for logging robot session errors through the day and sharing the log
repo_url: https://github.com/iainchesworthlabs/icl-error-journaling
# The one place that holds the site's address. Pages write {{ site_url }}; tools/ci/check_site_address.py holds the files
# that cannot read this line (the store URL files) to it. A custom domain is a change here (docs/ci.md, "The site address").
site_url: https://iainchesworthlabs.com/field-test/
docs_dir: docs
# Not published. The guide's list of pictures is data for tools/docs/guide_screenshots.py. The other files are for the
# people who work on the app and stay in the repository only.
exclude_docs: |
  guide/screenshots.json
  developers.md
  architecture.md
  building.md
  ci.md
  testing.md
  releasing.md
  licensing.md
  design/
  plan/
  signing-key.asc
strict: true
# Publishes config/sample-config.json as demo/demo-setup.ejconfig for App Review and new users.
hooks:
  - tools/docs/demo_setup_hook.py
  - tools/docs/site_address_hook.py
  - tools/docs/site_shell_hook.py
markdown_extensions:
  - attr_list  # sets the width of the guide's pictures: ![alt](img/x.png){ width="270" }
  - def_list  # the questions and answers of the FAQ page
theme:
  name: material
  custom_dir: tools/docs/theme  # the Field Test pages (marketing.html) and the guide's colours; see tools/docs/site_shell_hook.py
  font: false  # no web font: the site loads nothing from other sites
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
  features:
    - navigation.sections
    - content.code.copy
# The Field Test pages (marketing.html) are not in the guide's menu. The menu holds the guide only.
nav:
  - Guide:
      - Guide contents: guide/index.md
      - Getting started: guide/getting-started.md
      - Setting up the board: guide/setup.md
      - A day of logging: guide/logging.md
      - "Today's details": guide/todays-details.md
      - Sharing and the next day: guide/sharing.md
      - History: guide/history.md
      - The setup file: guide/setup-file.md
      - Questions and answers: guide/faq.md
      - Troubleshooting: guide/troubleshooting.md
