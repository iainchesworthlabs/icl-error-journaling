<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log – main board – dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FC6E6}a:hover{color:#8FC6E6}
.tile:active{transform:scale(0.96)}
.tile{transition:transform 120ms ease, box-shadow 120ms ease}
input::placeholder{color:#93A3B0}
</style>
</helmet>
<div style="width: 402px; height: 874px; position: relative; overflow: hidden; background: #0E141A; font-family: Inter, -apple-system, system-ui, sans-serif; color: #EEF2F6">
  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 59px 16px 0; display: flex; flex-direction: column; gap: 12px">

    <a href="Header.dc.html" style="display: flex; align-items: center; gap: 12px; background: #5B2A63; border-radius: 20px; padding: 12px 16px; min-height: 64px; box-sizing: border-box; text-decoration: none; color: #FFFFFF">
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.2px">UNIT-27</div>
        <div style="font-size: 13px; color: #EBDDF0">North Site · v1.4.2</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; color: #EBDDF0">
        <div style="font-weight: 600; color: #FFFFFF">Sat 7 Nov</div>
        <div>Sam Example</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EBDDF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <div style="background: #18212A; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(20,33,43,0.06)">
      <div style="display: flex; gap: 8px">
        <button onClick="{{pickSong}}" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #34434F; background: #121A21; font-family: inherit; font-size: 13px; font-weight: 500; color: #EEF2F6; display: flex; align-items: center; gap: 6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8FC6E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
          Played song
        </button>
        <button onClick="{{pickVisitor}}" style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #34434F; background: #121A21; font-family: inherit; font-size: 13px; font-weight: 500; color: #EEF2F6; display: flex; align-items: center; gap: 6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8FC6E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>

      </div>
      <div style="display: flex; gap: 8px; align-items: center">
        <label for="note" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Journal note</label>
        <input id="note" value="{{draft}}" onChange="{{onDraft}}" placeholder="Type a note, then hold a tile…" style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; border-radius: 12px; border: 1px solid #34434F; background: #121A21; padding: 0 12px; font-family: inherit; font-size: 15px; color: #EEF2F6">
        <button onClick="{{addNote}}" style="height: 44px; min-width: 64px; border-radius: 12px; border: 0; background: #2A6F96; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600">Add</button>
      </div>
    </div>

    <a href="Review.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: #18212A; border-radius: 14px; text-decoration: none; color: #EEF2F6; box-shadow: 0 1px 2px rgba(20,33,43,0.06)">
      <span style="font-size: 12px; font-weight: 600; color: #A7B6C3; text-transform: uppercase; letter-spacing: 0.5px">Last</span>
      <span style="font-size: 14px; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{lastLine}}</span>
      <span style="font-size: 13px; color: #A7B6C3; white-space: nowrap">{{entryCount}} today</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A7B6C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{tiles}}" as="tile" hint-placeholder-count="11">
        <button class="tile" onMouseDown="{{tile.down}}" onMouseUp="{{tile.up}}" onMouseLeave="{{tile.cancel}}" aria-label="{{tile.aria}}" style="position: relative; height: 104px; border-radius: 16px; border: 0; background: {{tile.bg}}; padding: 12px; display: flex; align-items: flex-end; text-align: left; font-family: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.2; color: #EEF2F6; box-shadow: 0 1px 2px rgba(20,33,43,0.08)">
          <span>{{tile.name}}</span>
          <sc-if value="{{tile.hasCount}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 8px; right: 8px; min-width: 24px; height: 24px; padding: 0 7px; box-sizing: border-box; border-radius: 12px; background: #F2F4F7; color: #14212B; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{tile.count}}</span>
          </sc-if>
        </button>
      </sc-for>
      <a href="Other.dc.html" aria-label="Other error type" style="height: 104px; box-sizing: border-box; border-radius: 16px; border: 1.5px dashed #74869A; background: #18212A; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; text-decoration: none; color: #EEF2F6">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8FC6E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        <span style="font-size: 13.5px; font-weight: 600">Other…</span>
      </a>
    </div>
  </div>

  <sc-if value="{{showToast}}" hint-placeholder-val="{{ true }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 95px; height: 52px; border-radius: 14px; background: #33444F; color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; box-shadow: 0 8px 24px rgba(20,33,43,0.25)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9FD3E8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      <span style="flex-grow: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{toastText}}</span>
      <button onClick="{{undo}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 0; background: #3C4D5C; color: #9FD3E8; font-family: inherit; font-size: 15px; font-weight: 600">Undo</button>
    </div>
  </sc-if>

  <sc-if value="{{showHint}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: {{hintBottom}}px; height: 42px; border-radius: 14px; background: #33444F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0 14px; font-size: 14px; box-shadow: 0 8px 24px rgba(20,33,43,0.25); pointer-events: none">Double-tap to log</div>
  </sc-if>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding-top: 8px; background: #18212A; border-top: 1px solid #27333E; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #8FC6E6; font-size: 10.5px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8FC6E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      Log
    </a>
    <a href="Review.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #A7B6C3; font-size: 10.5px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A7B6C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>
      Review
    </a>
    <a href="NewDay.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #A7B6C3; font-size: 10.5px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A7B6C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
      History
    </a>
    <a href="BoardSettings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #A7B6C3; font-size: 10.5px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A7B6C3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.types = [
      { id: 'hal', name: 'Wrong Response', bg: '#2E486B' },
      { id: 'seq', name: 'Sequence Out of Order', bg: '#45396A' },
      { id: 'wrongsong', name: 'Wrong Track Played', bg: '#63462C' },
      { id: 'findsong', name: 'Track Not Found', bg: '#225359' },
      { id: 'skip', name: 'Track Skipped', bg: '#62375E' },
      { id: 'drop', name: 'Audio Drop Out', bg: '#5C4E1F' },
      { id: 'vol', name: 'Volume Jump', bg: '#424B57' },
      { id: 'mute', name: 'Mute Delay', bg: '#333F71' },
      { id: 'speech', name: 'Speech Delay', bg: '#514238' },
      { id: 'songlat', name: 'Track Delay', bg: '#504835' },
      { id: 'auto', name: 'Navigation Failure', bg: '#5F3A48' }
    ];
    this.state = {
      counts: { hal: 2, wrongsong: 1, mute: 1, speech: 1 },
      entryCount: 7,
      lastLine: '10:20  T| Mute Delay',
      draft: '',
      showToast: true,
      showHint: false,
      toastText: 'Mute Delay logged at 10:20',
      undoInfo: null,
      repeat: 1,
      lastTypeId: 'mute'
    };
    this.timer = null;
    this.holdTimer = null;
    this.hintTimer = null;
    this.hideHint = null;
    this.gesture = null;
    this.touch = { logged: false, held: false };
    this.lastHint = 0;
  }
  componentWillUnmount() {
    if (this.timer) clearTimeout(this.timer);
    if (this.holdTimer) clearTimeout(this.holdTimer);
    if (this.hintTimer) clearTimeout(this.hintTimer);
    if (this.hideHint) clearTimeout(this.hideHint);
  }
  now() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }
  armToast() {
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(() => this.setState({ showToast: false, undoInfo: null, repeat: 1 }), 5000);
  }
  // A tile is logged by a double-tap (two touches within 300 ms of the lift of the first) or by a hold of 500 ms (BRD-07). One tap logs
  // nothing: after 300 ms it shows the hint "Double-tap to log" (2 s, at most once every 5 s). The haptic and the press are on the touch
  // of the second tap, so the entry is logged on the second mouse-down. A third tap is part of the same gesture; the fourth starts a new one.
  // A hold logs at 500 ms: with a note typed it goes on the line and the box clears, one Undo gives it back; with the box empty the
  // Edit entry sheet opens on the new entry with the cursor in the note (EditEntry.dc.html).
  down(type) {
    if (this.holdTimer) clearTimeout(this.holdTimer);
    if (this.hintTimer) clearTimeout(this.hintTimer);
    const now = Date.now();
    const g = this.gesture;
    if (g && g.id === type.id && now - g.up <= 300 && g.n < 3) g.n += 1;
    else this.gesture = { id: type.id, n: 1, up: 0 };
    this.touch = { logged: false, held: false };
    if (this.gesture.n === 2) {
      this.touch.logged = true;
      this.log(type, '');
    }
    this.holdTimer = setTimeout(() => { this.holdTimer = null; this.hold(type); }, 500);
  }
  up(type) {
    if (this.holdTimer) clearTimeout(this.holdTimer);
    this.holdTimer = null;
    const g = this.gesture;
    if (!g || this.touch.held) { this.gesture = null; return; }
    g.up = Date.now();
    if (g.n === 1) this.hintTimer = setTimeout(() => this.showHint(), 300);
  }
  cancel() {
    if (this.holdTimer) clearTimeout(this.holdTimer);
    this.holdTimer = null;
    this.gesture = null;
  }
  showHint() {
    const now = Date.now();
    if (this.lastHint && now - this.lastHint < 5000) return;
    this.lastHint = now;
    if (this.hideHint) clearTimeout(this.hideHint);
    this.setState({ showHint: true });
    this.hideHint = setTimeout(() => this.setState({ showHint: false }), 2000);
  }
  log(type, note) {
    const time = this.now();
    const s = this.state;
    const counts = Object.assign({}, s.counts);
    counts[type.id] = (counts[type.id] || 0) + 1;
    const repeat = (s.showToast && s.lastTypeId === type.id && !note) ? s.repeat + 1 : 1;
    const withNote = note ? ' with note' : '';
    const toastText = repeat > 1 ? type.name + ' logged ×' + repeat + ' at ' + time : type.name + ' logged at ' + time + withNote;
    this.setState({
      counts: counts,
      entryCount: s.entryCount + 1,
      lastLine: time + '  T| ' + type.name + (note ? ' – ' + note : ''),
      draft: note ? '' : s.draft,
      showToast: true,
      toastText: toastText,
      repeat: repeat,
      lastTypeId: type.id,
      undoInfo: { kind: 'error', typeId: type.id, prevLine: s.lastLine, prevRepeat: s.repeat, text: note || undefined }
    });
    this.armToast();
  }
  hold(type) {
    this.touch.held = true;
    const s = this.state;
    const text = s.draft.trim();
    if (!this.touch.logged) {
      this.touch.logged = true;
      this.log(type, text); // the hold logs: with the note when one is typed, alone when the Edit entry sheet opens instead
      return;
    }
    // A tap and then a hold: the second touch has logged, and the hold adds the note to that entry.
    if (!text) return;
    const u = s.undoInfo;
    if (!u || u.kind !== 'error' || u.typeId !== type.id) return;
    this.setState({
      draft: '',
      lastLine: s.lastLine + ' – ' + text,
      toastText: type.name + ' logged at ' + this.now() + ' with note',
      undoInfo: Object.assign({}, u, { text: text })
    });
    this.armToast();
  }
  addNote() {
    const text = this.state.draft.trim();
    if (!text) return;
    const time = this.now();
    const s = this.state;
    this.setState({
      draft: '',
      entryCount: s.entryCount + 1,
      lastLine: time + '  (Free Text) ' + text,
      showToast: true,
      toastText: 'Note added at ' + time,
      lastTypeId: null,
      repeat: 1,
      undoInfo: { kind: 'note', text: text, prevLine: s.lastLine }
    });
    this.armToast();
  }
  undo() {
    const u = this.state.undoInfo;
    if (this.timer) clearTimeout(this.timer);
    if (!u) {
      this.setState({ showToast: false });
      return;
    }
    const s = this.state;
    if (u.kind === 'error') {
      const counts = Object.assign({}, s.counts);
      counts[u.typeId] = Math.max(0, (counts[u.typeId] || 0) - 1);
      this.setState({ counts: counts, draft: u.text ? u.text : s.draft, entryCount: s.entryCount - 1, lastLine: u.prevLine, showToast: false, undoInfo: null, repeat: 1 });
    } else {
      this.setState({ draft: u.text, entryCount: s.entryCount - 1, lastLine: u.prevLine, showToast: false, undoInfo: null, repeat: 1 });
    }
  }
  renderVals() {
    const s = this.state;
    const tiles = this.types.map((t) => {
      const count = s.counts[t.id] || 0;
      return {
        name: t.name,
        bg: t.bg,
        count: count,
        hasCount: count > 0,
        aria: t.name + (count > 0 ? ', ' + count + ' today' : ''),
        down: () => this.down(t),
        up: () => this.up(t),
        cancel: () => this.cancel()
      };
    });
    return {
      tiles: tiles,
      draft: s.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      addNote: () => this.addNote(),
      pickSong: () => this.setState({ draft: 'Played ' }),
      pickVisitor: () => this.setState({ draft: 'Visitor interaction: ' }),
      lastLine: s.lastLine,
      entryCount: s.entryCount,
      showToast: s.showToast,
      showHint: s.showHint,
      hintBottom: s.showToast ? 155 : 95,
      toastText: s.toastText,
      undo: () => this.undo()
    };
  }
}
</script>
</body>
</html>
