<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit an entry</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5B7A}a:hover{color:#15435A}
</style>
</helmet>
<div style="width: 402px; height: 874px; position: relative; overflow: hidden; background: #3A4650; font-family: Inter, -apple-system, system-ui, sans-serif; color: #14212B">
  <div style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: #F2F4F7; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; padding: 0 16px">
    <div style="display: flex; justify-content: center; padding-top: 8px">
      <div style="width: 36px; height: 5px; border-radius: 3px; background: #C9D3DC"></div>
    </div>
    <div style="display: flex; align-items: center; padding: 8px 0 16px">
      <a href="Review.dc.html" style="font-size: 17px; text-decoration: none; color: #1E5B7A; min-width: 64px; height: 44px; display: flex; align-items: center">Cancel</a>
      <h1 style="flex-grow: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 600">Edit entry</h1>
      <a href="Review.dc.html" style="font-size: 17px; font-weight: 600; text-decoration: none; color: #1E5B7A; min-width: 64px; height: 44px; display: flex; align-items: center; justify-content: flex-end">Save</a>
    </div>

    <div style="background: #FFFFFF; border-radius: 14px; overflow: hidden">
      <button style="width: 100%; min-height: 52px; border: 0; border-bottom: 1px solid #E8ECF0; background: transparent; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-family: inherit; color: #14212B; text-align: left">
        <span style="font-size: 16px; flex-grow: 1">Error</span>
        <span style="width: 12px; height: 12px; border-radius: 3px; background: #FBE3CF"></span>
        <span style="font-size: 16px; color: #5A6B78">Wrong Track Played</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA8B4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <div style="display: flex; align-items: center; height: 52px; padding: 0 14px">
        <span style="font-size: 16px; flex-grow: 1">Time</span>
        <button style="height: 34px; padding: 0 12px; border-radius: 8px; border: 0; background: #E8EEF3; font-family: inherit; font-size: 16px; font-weight: 500; color: #14212B; font-variant-numeric: tabular-nums">11:02</button>
      </div>
    </div>

    <div style="margin-top: 22px; font-size: 12px; font-weight: 600; color: #5A6B78; text-transform: uppercase; letter-spacing: 0.5px; padding: 0 4px">Note</div>
    <label for="enote" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Note for this entry</label>
    <textarea id="enote" style="margin-top: 8px; height: 104px; box-sizing: border-box; border-radius: 14px; border: 0; background: #FFFFFF; padding: 12px 14px; font-family: inherit; font-size: 16px; line-height: 1.4; color: #14212B; resize: none">asked for Evening Song</textarea>

    <div style="margin-top: 22px; font-size: 12px; font-weight: 600; color: #5A6B78; text-transform: uppercase; letter-spacing: 0.5px; padding: 0 4px">In the shared log</div>
    <div style="margin-top: 8px; background: #FFFFFF; border-radius: 14px; padding: 14px; font-size: 14px; line-height: 1.45; color: #14212B">11:02 T| Wrong Track Played – asked for Evening Song</div>
    <p style="margin: 10px 4px 0; font-size: 13px; color: #5A6B78; line-height: 1.4">Logged at 11:02 on UNIT-27, version v1.4.2 (a1b2c3d).</p>

    <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; flex-direction: column; gap: 10px">
      <button style="height: 52px; border-radius: 14px; border: 0; background: #FFFFFF; color: #B42318; font-family: inherit; font-size: 17px; font-weight: 600">Delete entry</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
