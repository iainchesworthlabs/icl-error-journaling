<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Other error picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E5B7A}a:hover{color:#15435A}
input::placeholder{color:#6B7A86}
</style>
</helmet>
<div style="width: 402px; height: 874px; position: relative; overflow: hidden; background: #3A4650; font-family: Inter, -apple-system, system-ui, sans-serif; color: #14212B">
  <div style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: #F2F4F7; border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px">
      <div style="width: 36px; height: 5px; border-radius: 3px; background: #C9D3DC"></div>
    </div>
    <div style="display: flex; align-items: center; padding: 8px 16px 12px">
      <a href="Main.dc.html" style="font-size: 17px; text-decoration: none; color: #1E5B7A; min-width: 64px; height: 44px; display: flex; align-items: center">Cancel</a>
      <h1 style="flex-grow: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 600">Log another error</h1>
      <div style="min-width: 64px"></div>
    </div>
    <div style="padding: 0 16px 12px">
      <label for="search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search error types</label>
      <div style="display: flex; align-items: center; gap: 8px; height: 40px; border-radius: 10px; background: #E3E8ED; padding: 0 10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6B78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        <input id="search" placeholder="Search error types" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font-family: inherit; font-size: 16px; color: #14212B">
      </div>
    </div>
    <div style="padding: 0 16px; font-size: 12px; font-weight: 600; color: #5A6B78; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px">Not on your board</div>
    <div style="margin: 0 16px 16px; background: #FFFFFF; border-radius: 14px; overflow: hidden">
      <button style="width: 100%; height: 52px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #14212B; text-align: left; border-bottom: 1px solid #E8ECF0">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: #E5E9EE; border: 1px solid #C9D3DC"></span>
        <span style="flex-grow: 1">[Your other error type]</span>
      </button>
      <button style="width: 100%; height: 52px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #14212B; text-align: left">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: #E5E9EE; border: 1px solid #C9D3DC"></span>
        <span style="flex-grow: 1">[Another error type]</span>
      </button>
    </div>
    <div style="padding: 0 16px; font-size: 12px; font-weight: 600; color: #5A6B78; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px">On your board</div>
    <div style="margin: 0 16px 16px; background: #FFFFFF; border-radius: 14px; overflow: hidden">
      <button style="width: 100%; height: 46px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: inherit; font-size: 15px; color: #14212B; text-align: left; border-bottom: 1px solid #E8ECF0">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: #F5D9E0"></span>
        <span style="flex-grow: 1">Navigation Failure</span>
      </button>
      <button style="width: 100%; height: 46px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: inherit; font-size: 15px; color: #14212B; text-align: left; border-bottom: 1px solid #E8ECF0">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: #FFF0C2"></span>
        <span style="flex-grow: 1">Audio Drop Out</span>
      </button>
      <button style="width: 100%; height: 46px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: inherit; font-size: 15px; color: #14212B; text-align: left; border-bottom: 1px solid #E8ECF0">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: #D3ECEE"></span>
        <span style="flex-grow: 1">Track Not Found</span>
      </button>
      <button style="width: 100%; height: 46px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: inherit; font-size: 15px; color: #14212B; text-align: left; border-bottom: 1px solid #E8ECF0">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: #DCE8F7"></span>
        <span style="flex-grow: 1">Wrong Response</span>
        <span style="font-size: 13px; color: #5A6B78">2 today</span>
      </button>
      <button style="width: 100%; height: 46px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: inherit; font-size: 15px; color: #14212B; text-align: left; border-bottom: 1px solid #E8ECF0">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: #D9E2FB"></span>
        <span style="flex-grow: 1">Mute Delay</span>
        <span style="font-size: 13px; color: #5A6B78">1 today</span>
      </button>
      <button style="width: 100%; height: 46px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: inherit; font-size: 15px; color: #14212B; text-align: left">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: #FBE3CF"></span>
        <span style="flex-grow: 1">Wrong Track Played</span>
        <span style="font-size: 13px; color: #5A6B78">1 today</span>
      </button>
    </div>
    <div style="margin: 0 16px; background: #FFFFFF; border-radius: 14px; overflow: hidden">
      <button style="width: 100%; height: 52px; border: 0; background: transparent; display: flex; align-items: center; gap: 12px; padding: 0 14px; font-family: inherit; font-size: 16px; font-weight: 500; color: #1E5B7A; text-align: left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E5B7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Add a new error type
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
