name: Release

# Runs on a tag pushed from develop. Builds the iPhone application, signs it and sends it to TestFlight, then hands the
# release (the source archive) to the shared publish workflow, which checks the tag, signs, attests and publishes. No
# desktop package is built: the macOS and Linux builds are for development and the pull request gate only
# (docs/releasing.md).

on:
  push:
    tags: ["v*"]
  # Builds and uploads the packages from a branch without publishing, to try the packaging
  # (`gh workflow run release.yml --ref <branch>`). The version check and the publish job run for tags only.
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the iOS build to TestFlight (a manual run only validates it with Apple; a tag uploads)"
        type: boolean
        default: false

permissions: {}

jobs:
  version:
    name: Check the version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with the project version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/ci/check_release_version.py "$TAG"
      - name: Work out the version
        id: tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check the release has notes
        uses: iainchesworthlabs/icl-common-infra/actions/release-notes@6881be87088dca1650cc047e6e3ca7ae0efb4b9c # v0.1.20
        with:
          version: ${{ steps.tag.outputs.version }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          output-file: ${{ runner.temp }}/notes.md

  # The only asset of the GitHub release: the source at the tag, which the licence asks to be offered. The application
  # itself goes to TestFlight (the ios job) and is never put on the release. The publish job checksums, signs and attests
  # whatever this uploads.
  source:
    name: Package (source)
    needs: version
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive
        shell: bash
        env:
          NAME: error-journaling-${{ github.ref_type == 'tag' && github.ref_name || 'dry-run' }}-source
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="$NAME/" --output="dist/$NAME.tar.gz" HEAD
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: dist/*
          if-no-files-found: error

  # The iPhone and iPad application, signed with the Apple Distribution certificate (organisation secrets) and this
  # repository's own App Store provisioning profile, through the shared signing actions (docs/ios-signing.md in
  # icl-common-infra), and sent to TestFlight. It runs only when the repository variable SIGN_IOS_UPLOAD is `true`; with
  # it unset the release is made without iOS. The build number is the number of this run. A tag, or a manual run with
  # `upload_testflight`, uploads the build; any other run has Apple validate it and stops there. The IPA is a workflow
  # artifact for 7 days and is never put on the release: Testers install from the TestFlight app (docs/releasing.md).
  ios:
    name: Package (iOS)
    needs: version
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') && vars.SIGN_IOS_UPLOAD == 'true' }}
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # ERROR_JOURNALING_APPLICATION_ID in CMakeLists.txt; the check of the IPA fails if the two differ.
      BUNDLE_ID: com.iainchesworthlabs.errorjournaling
      EXECUTABLE: error-journaling
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The shared action names the secret that is missing, before anything else is downloaded.
      - name: Import the certificate and the provisioning profile
        id: signing
        uses: iainchesworthlabs/icl-common-infra/actions/import-ios-signing@6881be87088dca1650cc047e6e3ca7ae0efb4b9c # v0.1.20
        with:
          certificate-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          certificate-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          profile-base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          bundle-id: ${{ env.BUNDLE_ID }}
          method: app-store

      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@6881be87088dca1650cc047e6e3ca7ae0efb4b9c # v0.1.20

      - name: Set up CMake
        uses: iainchesworthlabs/icl-common-infra/actions/setup-cmake@6881be87088dca1650cc047e6e3ca7ae0efb4b9c # v0.1.20

      # Qt's iOS kit, and the macOS kit that aqtinstall's --autodesktop installs beside it for the host tools a cross build
      # runs (moc, rcc, qmlcachegen, qsb). The version is the `qt` key of .github/toolchain-versions.json, as for every
      # other build. Not cached: the iOS kit is several gigabytes, and the repository's cache quota is better spent on the
      # builds that run on every push.
      - name: Read the Qt version
        id: qt
        shell: bash
        run: echo "version=$(jq -r .qt .github/toolchain-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Install Qt (iOS kit and macOS host kit)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ steps.qt.outputs.version }}
          host: mac
          target: ios
          arch: ios
          dir: ${{ runner.temp }}
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          cache: false

      - name: Name the Qt kits
        shell: bash
        env:
          QT_VERSION: ${{ steps.qt.outputs.version }}
        run: |
          echo "QT_ROOT_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/ios" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"

      # Signed for the application alone (apps/app/packaging/ios.cmake says why). CMake makes no Xcode scheme unless asked,
      # and `xcodebuild archive` takes only a scheme.
      - name: Configure (signed)
        shell: bash
        env:
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile-name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: >
          cmake --preset ios-release
          -DCMAKE_XCODE_GENERATE_SCHEME=ON
          -DERROR_JOURNALING_IOS_BUILD_NUMBER="$BUILD_NUMBER"
          -DERROR_JOURNALING_IOS_SIGNING_TEAM="$TEAM_ID"
          -DERROR_JOURNALING_IOS_SIGNING_PROFILE="$PROFILE_NAME"

      - name: Name the package
        id: name
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          label=dry-run
          if [ "$REF_TYPE" = tag ]; then label="$REF_NAME"; fi
          project="$(find build/ios-release -maxdepth 1 -name '*.xcodeproj' | head -n 1)"
          [ -n "$project" ] || { echo "::error::CMake made no .xcodeproj under build/ios-release"; exit 1; }
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "ipa=dist-ios/error-journaling-$label-ios-appstore.ipa" >> "$GITHUB_OUTPUT"
          echo "version=${label#v}" >> "$GITHUB_OUTPUT"

      - name: Archive and export the IPA
        id: export
        uses: iainchesworthlabs/icl-common-infra/actions/export-ios-ipa@6881be87088dca1650cc047e6e3ca7ae0efb4b9c # v0.1.20
        with:
          project: ${{ steps.name.outputs.project }}
          scheme: ej_app
          bundle-id: ${{ env.BUNDLE_ID }}
          team-id: ${{ steps.signing.outputs.team-id }}
          profile-name: ${{ steps.signing.outputs.profile-name }}
          method: app-store
          output: ${{ steps.name.outputs.ipa }}

      # The signed IPA, opened as a device would: identifier, version, the icon, no permission text, arm64, a valid
      # signature, and an App Store profile for this identifier.
      - name: Check the IPA
        shell: bash
        env:
          IPA: ${{ steps.export.outputs.ipa }}
          VERSION: ${{ steps.name.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          args=(--bundle-id "$BUNDLE_ID" --executable "$EXECUTABLE" --signed --store)
          if [ "$REF_TYPE" = tag ]; then args+=(--version "${VERSION%%-*}"); fi
          apps/app/packaging/ios/verify_app.sh "$IPA" "${args[@]}"

      # Apple's own check of the icon, the property list, the signature and the privacy declarations; and, for a tag or a
      # manual run that asks, the upload to TestFlight.
      - name: Validate with Apple, and upload to TestFlight
        uses: iainchesworthlabs/icl-common-infra/actions/upload-testflight@6881be87088dca1650cc047e6e3ca7ae0efb4b9c # v0.1.20
        with:
          ipa: ${{ steps.export.outputs.ipa }}
          key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          issuer-id: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          validate-only: ${{ github.ref_type != 'tag' && inputs.upload_testflight != true }}

      - name: Remove the signing keychain and profile
        if: always()
        uses: iainchesworthlabs/icl-common-infra/actions/import-ios-signing@6881be87088dca1650cc047e6e3ca7ae0efb4b9c # v0.1.20
        with:
          remove: "true"

      # Named ios-appstore, not release-*: only an artifact named release-* goes to the release (the publish job's pattern).
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-appstore
          retention-days: 7
          path: dist-ios/*
          if-no-files-found: error

      - name: Say how to install it
        shell: bash
        env:
          UPLOADED: ${{ github.ref_type == 'tag' || inputs.upload_testflight == true }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          {
            echo "### iOS build for TestFlight"
            if [ "$UPLOADED" = true ]; then
              echo "Uploaded as build $BUILD_NUMBER. Apple processes it for a few minutes; then it is in the TestFlight app for the internal testers."
            else
              echo "Validated by Apple, not uploaded. Run the workflow with \`upload_testflight\` (or push a tag) to upload build $BUILD_NUMBER."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: [source, ios]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.source.result == 'success' && (needs.ios.result == 'success' || needs.ios.result == 'skipped') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/release-publish.yml@6881be87088dca1650cc047e6e3ca7ae0efb4b9c # v0.1.20
    secrets:
      REPO_GPG_PRIVATE_KEY: ${{ secrets.REPO_GPG_PRIVATE_KEY }}
      REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
      RELEASE_BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
