name: Kill harness (nightly)

# The nightly tier of the Stage 2 kill harness (docs/plan/stage-2.md, section 4.4): 1,000 random kills in 4 shards of 250 on
# Linux (release) and macOS, with a fresh seed each night, and the crash points, 200 random kills of recovery, 200 of a
# migration and the typed-draft kills in every leg. The seed is printed in the run's summary and kept as the artifact
# `kill-nightly-seed`. A red night opens, or adds to, the standing `nightly` issue.

on:
  schedule:
    - cron: "41 16 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  kill:
    name: Kill harness
    permissions:
      contents: read
    uses: ./.github/workflows/kill-harness.yml
    with:
      tier: nightly
      iterations: 1000
      shards: 4
      secondary-iterations: 200
      legs: >-
        [
          {"name": "linux-gcc-release", "runner": ["ubuntu-26.04"], "compiler": "gcc", "preset": "linux-release"},
          {"name": "macos-release", "runner": ["macos-26"], "preset": "macos-release"}
        ]

  report:
    name: Report
    needs: kill
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
      checks: read
    steps:
      - name: Say how the night went
        uses: iainchesworthlabs/icl-common-infra/actions/nightly-report@ac3ee29b71f27ff63b1e0db61cb335764ed56940 # v0.1.23
        with:
          needs-json: ${{ toJSON(needs) }}
          gating-jobs: kill
