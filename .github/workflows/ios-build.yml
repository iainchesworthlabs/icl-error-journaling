name: iOS build

# An unsigned compile check of the iPhone and iPad application (apps/app): the `ios-release` preset, and a look inside the
# .app Xcode made (apps/app/packaging/ios/verify_app.sh). It needs no Apple account and no secret; a signed build is the
# release workflow's, with the owner's account.
#
# Not a required check, and not on the merge queue: it runs on a pull request only when an Apple path changes (a required
# check that a path filter keeps from running never reports, which would hold every unrelated pull request), and a macOS
# runner is billed at a multiple. Dispatch it by hand to run it anywhere:
#   gh workflow run ios-build.yml --ref <branch>

on:
  # A pull request runs it only when it touches Apple paths; every other change is checked on the push to develop
  # (decision 1 of icl-common-infra docs/ci-many-agents.md, section 9). Dispatch it on a branch to run it earlier.
  pull_request:
    branches: [main, develop]
    paths:
      - "libs/*/src/platform/ios/**"
      - "libs/ios_bridge/**"
      - "**/*.mm"
      - "apps/app/packaging/**"
      - "apps/app/CMakeLists.txt"
      - "cmake/**"
      - "tools/licences/**"
      - "CMakePresets.json"
      - ".github/workflows/ios-build.yml"
      - ".github/toolchain-versions.json"
  push:
    branches: [main, develop]
    paths:
      - "libs/**"
      - "apps/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/ios-build.yml"
      - ".github/toolchain-versions.json"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

# No job gets more than it names below.
permissions: {}

env:
  VCPKG_DISABLE_METRICS: "1"
  # The bundle identifier of CMakeLists.txt (ERROR_JOURNALING_APPLICATION_ID), which the check of the bundle compares.
  BUNDLE_ID: com.iainchesworthlabs.errorjournaling

jobs:
  ios-build:
    name: iOS (${{ matrix.name }}, unsigned compile)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: device, preset: ios-release}
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The vcpkg toolchain is the toolchain file of every preset, iOS's included (it chains to Qt's). The manifest has no
      # dependency for a device (the tests are not built there).
      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@eefe9b6b38220ab4086bfb227eafbf0d87e36189 # v0.1.22

      - name: Set up CMake
        uses: iainchesworthlabs/icl-common-infra/actions/setup-cmake@eefe9b6b38220ab4086bfb227eafbf0d87e36189 # v0.1.22

      # Qt's iOS kit, and the macOS kit that aqtinstall's --autodesktop installs beside it for the host tools a cross build
      # runs (moc, rcc, qmlcachegen, qsb). The version is the `qt` key of .github/toolchain-versions.json, as for every
      # other build. Not cached: the iOS kit is several gigabytes, and the repository's cache quota is better spent on the
      # builds that run on every push.
      - name: Read the Qt version
        id: qt
        shell: bash
        run: echo "version=$(jq -r .qt .github/toolchain-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Install Qt (iOS kit and macOS host kit)
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ steps.qt.outputs.version }}
          host: mac
          target: ios
          arch: ios
          dir: ${{ runner.temp }}
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          cache: false

      - name: Name the Qt kits
        shell: bash
        env:
          QT_VERSION: ${{ steps.qt.outputs.version }}
        run: |
          echo "QT_ROOT_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/ios" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"

      - name: Show the toolchain
        shell: bash
        run: |
          cmake --version | head -n 1
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --preset "$PRESET"

      - name: Build
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$PRESET"

      # The licences of what the iPhone binary links, read off the real link line by the build itself (tools/licences/notices.py,
      # which fails the build above when a library has no licence entry). Printed so that a pull request can quote it.
      - name: Show the third-party notices
        if: always()
        shell: bash
        run: |
          notices="$(find build/ios-release -name third-party-notices.json | head -n 1)"
          [ -n "$notices" ] || { echo "::error::no third-party-notices.json under build/ios-release"; exit 1; }
          python3 tools/licences/show_notices.py "$notices" --inputs | tee -a "$GITHUB_STEP_SUMMARY"

      # What Xcode made, from the bundle alone: the identifier, the icon, the launch screen, no permission text, arm64 and no
      # link to the build machine. (An unsigned build: no --signed.)
      - name: Check the application bundle
        if: matrix.name == 'device'
        shell: bash
        run: |
          set -euo pipefail
          app="$(find build/ios-release -name error-journaling.app -type d | head -n 1)"
          [ -n "$app" ] || { echo "::error::no error-journaling.app under build/ios-release"; exit 1; }
          plutil -lint apps/app/packaging/ios/error-journaling.entitlements
          apps/app/packaging/ios/verify_app.sh "$app" --bundle-id "$BUNDLE_ID" --executable error-journaling
