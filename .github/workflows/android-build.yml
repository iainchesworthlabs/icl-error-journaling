# SPDX-License-Identifier: GPL-3.0-or-later
# The Android build (docs/plan/stage-9.md, "CI jobs"; docs/ci.md, "Android build"). Builds the android-release preset
# into an unsigned APK and bundle with Qt's Android kit, the NDK the kit was built with and JDK 21, then looks inside them
# (tools/ci/check_android_package.py): the manifest asks for no permission, the SDK range is 28 to 36, and every native
# library is aligned for 16 KB pages. Nothing runs on a device or an emulator here (that is package 9.8).
name: Android build

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "libs/*/src/platform/android/**"
      - "libs/*/tests/**/platform/android/**"
      - "libs/ios_bridge/CMakeLists.txt"
      - "libs/storage/CMakeLists.txt"
      - "apps/app/CMakeLists.txt"
      - "apps/app/packaging/android/**"
      - "apps/app/packaging/android.cmake"
      - "tools/ci/check_android_package.py"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/android-build.yml"
      - ".github/toolchain-versions.json"
  push:
    branches: [main, develop]
    paths:
      - "libs/**"
      - "apps/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "tools/ci/check_android_package.py"
      - ".github/workflows/android-build.yml"
      - ".github/toolchain-versions.json"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

permissions: {}

env:
  VCPKG_DISABLE_METRICS: "1"
  APPLICATION_ID: com.iainchesworthlabs.errorjournaling
  # The NDK Qt 6.12.0's Android kit was built with (its modules/Core.json); Qt recommends the same one.
  NDK_VERSION: "27.2.12479018"
  ANDROID_PLATFORM_PACKAGE: "platforms;android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"

jobs:
  android-build:
    name: Android (arm64-v8a, unsigned build)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@ac3ee29b71f27ff63b1e0db61cb335764ed56940 # v0.1.23

      - name: Set up CMake
        uses: iainchesworthlabs/icl-common-infra/actions/setup-cmake@ac3ee29b71f27ff63b1e0db61cb335764ed56940 # v0.1.23

      # The desktop kit first: Qt's Android build runs its host tools (moc, qmlcachegen, androiddeployqt).
      - name: Install Qt (Linux host kit)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@ac3ee29b71f27ff63b1e0db61cb335764ed56940 # v0.1.23

      - name: Remember the host kit
        shell: bash
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Read the Qt version
        id: qt
        shell: bash
        run: echo "version=$(jq -r .qt .github/toolchain-versions.json)" >> "$GITHUB_OUTPUT"

      # aqtinstall 3.3.0 cannot read Qt 6.12's all_os Android repository, so the same pinned source as the iOS build.
      - name: Install Qt (Android arm64-v8a kit)
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@ac3ee29b71f27ff63b1e0db61cb335764ed56940 # v0.1.23
        with:
          version: ${{ steps.qt.outputs.version }}
          target: android
          arch: android_arm64_v8a
          host: all_os
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

      - name: Name the Qt kits
        shell: bash
        run: |
          set -euo pipefail
          [ -f "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" ] || { echo "::error::no Android kit at $QT_ROOT_DIR"; exit 1; }
          [ -x "$QT_HOST_PATH/bin/qmake" ] || [ -x "$QT_HOST_PATH/bin/qtpaths" ] || { echo "::error::no host kit at $QT_HOST_PATH"; exit 1; }
          echo "QT_ANDROID_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      # The runner image has an Android SDK. Only the exact NDK, platform and build tools are added, when it lacks them.
      - name: Set up the Android SDK, NDK and JDK 21
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          [ -d "$sdk" ] || { echo "::error::the runner has no Android SDK"; exit 1; }
          [ -n "${JAVA_HOME_21_X64:-}" ] || { echo "::error::the runner has no JDK 21"; exit 1; }
          sdkmanager="$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | sort | tail -n 1)"
          JAVA_HOME="$JAVA_HOME_21_X64" "$sdkmanager" --sdk_root="$sdk" --install \
            "ndk;$NDK_VERSION" "$ANDROID_PLATFORM_PACKAGE" "build-tools;$ANDROID_BUILD_TOOLS" > /dev/null
          {
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_NDK_ROOT=$sdk/ndk/$NDK_VERSION"
            echo "ANDROID_NDK_HOME=$sdk/ndk/$NDK_VERSION"
            echo "JAVA_HOME=$JAVA_HOME_21_X64"
          } >> "$GITHUB_ENV"

      - name: Show the toolchain
        shell: bash
        run: |
          cmake --version | head -n 1
          "$JAVA_HOME/bin/java" -version 2>&1 | head -n 1
          grep Pkg.Revision "$ANDROID_NDK_ROOT/source.properties"
          echo "Qt Android kit: $QT_ANDROID_DIR; host kit: $QT_HOST_PATH"

      - name: Configure
        run: cmake --preset android-release

      # One after the other: Qt's apk and aab targets share one Gradle directory, and in parallel they delete each other's
      # intermediate files.
      - name: Build the APK
        run: cmake --build --preset android-release

      - name: Build the bundle
        run: cmake --build --preset android-release-bundle

      - name: Check the packages
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/android-release -name '*.apk' -path '*outputs*release*' | sort | head -n 1)"
          aab="$(find build/android-release -name '*.aab' -path '*outputs*release*' | sort | head -n 1)"
          [ -n "$apk" ] || { echo "::error::no APK under build/android-release"; exit 1; }
          [ -n "$aab" ] || { echo "::error::no bundle under build/android-release"; exit 1; }
          python3 tools/ci/check_android_package.py --sdk "$ANDROID_SDK_ROOT" --ndk "$ANDROID_NDK_ROOT" \
            --application-id "$APPLICATION_ID" "$apk" "$aab"
          mkdir -p android-packages
          cp "$apk" "$aab" android-packages/

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: android-packages/
          retention-days: 7
