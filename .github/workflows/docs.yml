name: Docs

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [develop]
    paths: ["docs/**", "mkdocs.yml", "requirements/docs.txt", ".github/workflows/docs.yml", "tools/docs/**", "config/sample-config.json"]
  # The site publishes from develop, independently of app releases, and only when something the build reads changed
  # (the same paths as a pull request). A push that changes only app code does not deploy the site.
  push:
    branches: [develop]
    paths: ["docs/**", "mkdocs.yml", "requirements/docs.txt", ".github/workflows/docs.yml", "tools/docs/**", "config/sample-config.json"]
  # A manual run from develop republishes the site (for example after the deploy role's trust changed).
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build site
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@ad95a5a5201bb6dd3126ae3ffd21499e92028689 # v0.1.27
    with:
      site-artifact: docs-site

  publish:
    name: Build site for the domain
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@ad95a5a5201bb6dd3126ae3ffd21499e92028689 # v0.1.27
    with:
      site-artifact: docs-site

  # Production: https://iainchesworthlabs.com/field-test/, from develop. The role, bucket and distribution come from
  # the repository secrets DOCS_ROLE_ARN, DOCS_BUCKET and DOCS_DISTRIBUTION_ID (set by the owner). The role's trust
  # policy must allow a push to refs/heads/develop of this repository.
  deploy:
    name: Deploy site
    needs: publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@ad95a5a5201bb6dd3126ae3ffd21499e92028689 # v0.1.27
    with:
      prefix: field-test
      production-ref: refs/heads/develop
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}

  # A denied role assumption would otherwise be one red step among many. Say what it means and what to do.
  deploy-failed:
    name: Explain a failed deploy
    needs: deploy
    if: failure() && needs.deploy.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Say what to check
        shell: bash
        run: |
          set -euo pipefail
          message="The production docs deploy failed. If the step 'Assume the production role' says the web identity token cannot be assumed or the action is not authorized, the deploy role's trust policy does not allow a push to refs/heads/develop of this repository: the owner runs the site stack's deploy (icl-site, cdk deploy), then re-runs this workflow (Actions, Docs, Run workflow, from develop). If another step failed, read its log. The site stays at its last good version."
          echo "::error title=Docs deploy failed::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Preview of a pull request from this repository, at https://iainchesworthlabs.com/_preview/field-test/pr-<n>/.
  preview:
    name: Deploy preview
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@ad95a5a5201bb6dd3126ae3ffd21499e92028689 # v0.1.27
    with:
      prefix: field-test
      preview: true
      pr-number: ${{ github.event.pull_request.number }}
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}

  remove-preview:
    name: Remove preview
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy-aws.yml@ad95a5a5201bb6dd3126ae3ffd21499e92028689 # v0.1.27
    with:
      mode: remove-preview
      prefix: field-test
      pr-number: ${{ github.event.pull_request.number }}
    secrets:
      DOCS_ROLE_ARN: ${{ secrets.DOCS_ROLE_ARN }}
      DOCS_PREVIEW_ROLE_ARN: ${{ secrets.DOCS_PREVIEW_ROLE_ARN }}
      DOCS_BUCKET: ${{ secrets.DOCS_BUCKET }}
      DOCS_DISTRIBUTION_ID: ${{ secrets.DOCS_DISTRIBUTION_ID }}
