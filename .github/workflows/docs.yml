name: Docs

on:
  pull_request:
    branches: [develop]
    paths: ["docs/**", "mkdocs.yml", "requirements/docs.txt", ".github/workflows/docs.yml", "tools/docs/**", "config/sample-config.json"]
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build site
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@eb889c92bd71b4cb51d6f1d3cbf7541255400a49 # v0.1.24

  publish:
    name: Build site for Pages
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs.yml@eb889c92bd71b4cb51d6f1d3cbf7541255400a49 # v0.1.24
    with:
      upload: true

  deploy:
    name: Deploy site
    needs: publish
    if: github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/docs-deploy.yml@eb889c92bd71b4cb51d6f1d3cbf7541255400a49 # v0.1.24
