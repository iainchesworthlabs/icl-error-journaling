name: CI

# The pull request gate. Pull requests (drafts included) run the static checks. Ready pull
# requests also build (Linux release and ASan/UBSan; coverage with the `deep` label). Merge-queue entries build everything. Linux debug and TSan run in the merge queue. The
# macOS builds run after the merge, on the push to develop, unless the queue entry touches Apple
# paths or its pull request carries the `deep` label (docs/ci.md).
#
# CI reuse (docs/ci-many-agents.md in icl-common-infra) is in shadow mode: the `reuse` job looks for
# earlier results and logs what it would skip, and every group still runs. `CI Status` records a
# proof of each run for later lookups.
#
# Required status checks are the two jobs defined here by name: "CI Status" and
# "Scan dependency diff". A check from a called workflow carries the caller's job name as
# a prefix, so it cannot be required by its plain name.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [develop]
  # Runs every leg on the chosen branch (`gh workflow run ci.yml --ref <branch>`), so a change to
  # threading, the standard library or platform code can be tried on macOS before it is queued.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Policy
    permissions:
      contents: read
      pull-requests: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/policy.yml@62594bba592708100d459112523992fa2a736843 # v0.1.21

  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      macos: ${{ steps.macos.outputs.macos }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the shared scripts
        uses: iainchesworthlabs/icl-common-infra/actions/checkout-infra@62594bba592708100d459112523992fa2a736843 # v0.1.21
      - name: Check the vendored CMake modules
        run: python3 tools/ci/sync_cmake.py --check --infra .icl-infra
      - name: Check the platform layout
        run: python3 tools/ci/check_platform_layout.py
      - name: Check the iOS property list
        run: python3 tools/ci/check_ios_plist.py
      - name: Check the application never uses the network
        run: python3 tools/ci/check_no_network.py
      - name: Decide scope
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "merge_group" ]; then
            git diff --name-only "$BASE_SHA"...HEAD | python3 .icl-infra/scripts/plan_gate.py --config .github/ci/plan.json --groups > "$RUNNER_TEMP/plan.out"
          else
            python3 .icl-infra/scripts/plan_gate.py --config .github/ci/plan.json --groups --force-all < /dev/null > "$RUNNER_TEMP/plan.out"
          fi
          cat "$RUNNER_TEMP/plan.out" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/plan.out"
      # Where the macOS groups run (decision 1 of docs/ci-many-agents.md, section 9). They run after the merge (the push run)
      # and on a manual run. A queue entry also runs them when its diff promotes build-macos (an Apple path) or its pull
      # request carries `deep`. A pull request run never does. If the label cannot be read, the groups run.
      - name: Place the macOS groups
        id: macos
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          set -uo pipefail
          macos=false
          if [ "$BUILD" = "true" ]; then
            case "$EVENT" in
              push|workflow_dispatch) macos=true ;;
              merge_group)
                if grep -q '^promoted=.*build-macos' "$RUNNER_TEMP/plan.out"; then
                  macos=true
                  echo "The change touches Apple paths: macOS runs in the queue."
                else
                  number="$(printf '%s' "$HEAD_REF" | sed -n 's|.*/pr-\([0-9][0-9]*\)-.*|\1|p')"
                  if [ -n "$number" ] && deep="$(gh api "repos/$REPO/pulls/$number" --jq '[.labels[].name] | index("deep") != null')"; then
                    if [ "$deep" = "true" ]; then macos=true; echo "Pull request $number carries deep: macOS runs in the queue."; fi
                  else
                    macos=true
                    echo "::warning::could not read the labels of the pull request; macOS runs in the queue"
                  fi
                fi ;;
            esac
          fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"

  # Looks for earlier runs that already passed a group on a tree that differs only in paths the group does not read.
  # CI_REUSE_MODE is unset, which means shadow: the lookup is logged in the job summary and `reused` stays empty, so
  # every group still runs. It cannot fail the workflow (continue-on-error, and find-proof falls back on any error).
  reuse:
    name: Reuse
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.find.outputs.run }}
      reused: ${{ steps.find.outputs.reused }}
      would_reuse: ${{ steps.find.outputs.would_reuse }}
      mode: ${{ steps.find.outputs.mode }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for reusable results
        id: find
        uses: iainchesworthlabs/icl-common-infra/actions/find-proof@62594bba592708100d459112523992fa2a736843 # v0.1.21
        with:
          mode: ${{ vars.CI_REUSE_MODE }}
          base-sha: ${{ github.event_name == 'push' && github.event.before || '' }}

  build-fast:
    name: Build (fast)
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/build.yml@62594bba592708100d459112523992fa2a736843 # v0.1.21
    with:
      # "tests": true is written on every leg: build.yml skips its Test step when the key is absent (an absent key is null,
      # and `null != false` is false in a workflow expression), although its header says the default is to test.
      legs: >-
        [
          {"name": "linux-gcc-release", "runner": ["ubuntu-26.04"], "compiler": "gcc", "preset": "linux-release", "qt": true, "tests": true, "timeout_minutes": 60},
          {"name": "linux-clang-asan-ubsan", "runner": ["ubuntu-26.04"], "compiler": "clang", "preset": "linux-asan-ubsan", "qt": true, "tests": true, "timeout_minutes": 60}
        ]

  build-linux-full:
    name: Build (Linux full)
    needs: plan
    if: needs.plan.outputs.build == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/build.yml@62594bba592708100d459112523992fa2a736843 # v0.1.21
    with:
      legs: >-
        [
          {"name": "linux-gcc-debug", "runner": ["ubuntu-26.04"], "compiler": "gcc", "preset": "linux-debug", "qt": true, "tests": true, "vcpkg_features": "profiling", "timeout_minutes": 60},
          {"name": "linux-clang-tsan", "runner": ["ubuntu-26.04"], "compiler": "clang", "preset": "linux-tsan", "qt": true, "tests": true, "timeout_minutes": 60}
        ]

  build-macos:
    name: Build (macOS)
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/build.yml@62594bba592708100d459112523992fa2a736843 # v0.1.21
    with:
      legs: >-
        [
          {"name": "macos-debug", "runner": ["macos-26"], "preset": "macos-debug", "qt": true, "tests": true, "timeout_minutes": 30},
          {"name": "macos-release", "runner": ["macos-26"], "preset": "macos-release", "qt": true, "tests": true, "timeout_minutes": 30}
        ]

  # Experimental: it reports and cannot fail the run, and it is not a reuse group. The design puts it in a nightly run;
  # ci.yml has none, so it runs after the merge and on a manual run until one exists.
  macos-xcode27:
    name: Build (Xcode 27)
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/build.yml@62594bba592708100d459112523992fa2a736843 # v0.1.21
    with:
      legs: >-
        [
          {"name": "macos-xcode27-release", "runner": ["xcode-27"], "preset": "macos-release", "qt": true, "tests": true, "experimental": true, "timeout_minutes": 30}
        ]

  # The kill harness (docs/plan/stage-2.md, section 4.4): 100 random kills, the crash points, and the random kills of
  # recovery, a migration and the typed draft, on the legs that find memory and threading errors on the recovery path and on
  # macOS. A pull request runs the smaller set that the unit and integration phase of the builds above include (25).
  kill-queue:
    name: Kill harness (queue)
    needs: plan
    if: needs.plan.outputs.build == 'true' && github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/kill-harness.yml
    with:
      tier: merge-queue
      iterations: 100
      shards: 1
      secondary-iterations: 25
      timeout-minutes: 90
      legs: >-
        [
          {"name": "linux-gcc-debug", "runner": ["ubuntu-26.04"], "compiler": "gcc", "preset": "linux-debug"},
          {"name": "linux-clang-asan-ubsan", "runner": ["ubuntu-26.04"], "compiler": "clang", "preset": "linux-asan-ubsan"},
          {"name": "linux-clang-tsan", "runner": ["ubuntu-26.04"], "compiler": "clang", "preset": "linux-tsan"},
          {"name": "macos-debug", "runner": ["macos-26"], "preset": "macos-debug"}
        ]

  # Coverage runs in the merge queue and on a push; a pull request runs it only with the `deep` label (docs/ci.md,
  # "Where the time goes"), because the queue entry repeats it on the merged tree.
  coverage:
    name: Coverage
    needs: plan
    if: needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'deep')))
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the shared scripts
        uses: iainchesworthlabs/icl-common-infra/actions/checkout-infra@62594bba592708100d459112523992fa2a736843 # v0.1.21
      - name: Install GCC
        uses: iainchesworthlabs/icl-common-infra/actions/setup-gcc@62594bba592708100d459112523992fa2a736843 # v0.1.21
      - name: Set up Qt
        uses: iainchesworthlabs/icl-common-infra/actions/setup-qt@62594bba592708100d459112523992fa2a736843 # v0.1.21
      - name: Set up CMake
        uses: iainchesworthlabs/icl-common-infra/actions/setup-cmake@62594bba592708100d459112523992fa2a736843 # v0.1.21
      - name: Set up vcpkg
        uses: iainchesworthlabs/icl-common-infra/actions/setup-vcpkg@62594bba592708100d459112523992fa2a736843 # v0.1.21
      - name: Set up ccache
        uses: iainchesworthlabs/icl-common-infra/actions/setup-ccache@62594bba592708100d459112523992fa2a736843 # v0.1.21
        with:
          key: coverage
      - name: Configure and build
        run: |
          cmake --preset linux-coverage
          cmake --build --preset linux-coverage
      - name: Test
        uses: iainchesworthlabs/icl-common-infra/actions/run-ctest@62594bba592708100d459112523992fa2a736843 # v0.1.21
        with:
          build-dir: build/linux-coverage
      - name: Report and gate
        run: |
          python3 -m pip install --quiet gcovr==8.7
          gcovr --root . --object-directory build/linux-coverage --json coverage.json \
            --exclude-throw-branches --exclude-unreachable-branches \
            --filter 'libs/' --filter 'apps/' --exclude '.*/tests/'
          python3 .icl-infra/scripts/coverage_gate.py --report coverage.json --floors tools/coverage-floors.json
      - name: Save caches
        if: always()
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/save-vcpkg-cache@62594bba592708100d459112523992fa2a736843 # v0.1.21

  zizmor:
    name: Workflow analysis
    permissions:
      contents: read
      security-events: write
    uses: iainchesworthlabs/icl-common-infra/.github/workflows/zizmor.yml@62594bba592708100d459112523992fa2a736843 # v0.1.21

  dependency-scan:
    name: Scan dependency diff
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: iainchesworthlabs/icl-common-infra/actions/dependency-review@62594bba592708100d459112523992fa2a736843 # v0.1.21

  confidentiality:
    name: Confidentiality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the store graphics tools
        run: python3 -m pip install --quiet -r requirements/store.txt
      - name: Test the checks
        run: python3 -m unittest discover -s tools/tests -v
      - name: Check for other configuration files
        run: python3 tools/ci/check_config_files.py
      - name: Check for confidential terms
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
          EVENT: ${{ github.event_name }}
          SECRETS_UNAVAILABLE: ${{ github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]' }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--event "$EVENT")
          if [ "$SECRETS_UNAVAILABLE" = "true" ]; then args+=(--secrets-unavailable); fi
          case "$EVENT" in
            pull_request) args+=(--range "$PR_BASE..$PR_HEAD") ;;
            merge_group) args+=(--range "$GROUP_BASE..$GROUP_HEAD") ;;
            push)
              if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                args+=(--range "$PUSH_AFTER^!")
              else
                args+=(--range "$PUSH_BEFORE..$PUSH_AFTER")
              fi ;;
          esac
          python3 tools/ci/check_confidential_terms.py "${args[@]}"

  ci-status:
    name: CI Status
    if: always()
    needs: [policy, plan, reuse, build-fast, build-linux-full, build-macos, macos-xcode27, kill-queue, coverage, zizmor, dependency-scan, confidentiality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Aggregate
        uses: iainchesworthlabs/icl-common-infra/actions/ci-status@62594bba592708100d459112523992fa2a736843 # v0.1.21
        with:
          needs: ${{ toJSON(needs) }}
          # Shadow mode: the reuse job's `reused` output is empty, so nothing counts as reused and every group must have run.
          reused: ${{ needs.reuse.outputs.reused }}
          expected: >-
            {
              "build-fast": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }},
              "coverage": ${{ needs.plan.outputs.build == 'true' && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && contains(github.event.pull_request.labels.*.name, 'deep'))) }},
              "build-linux-full": ${{ needs.plan.outputs.build == 'true' && github.event_name != 'pull_request' }},
              "build-macos": ${{ needs.plan.outputs.macos == 'true' }},
              "macos-xcode27": ${{ needs.plan.outputs.build == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }},
              "kill-queue": ${{ needs.plan.outputs.build == 'true' && github.event_name != 'pull_request' }},
              "dependency-scan": ${{ github.event_name != 'push' }},
              "confidentiality": true
            }
      # The proof of this run, for the lookups of later runs (docs/ci.md). It runs only infra code and never fails the job.
      - name: Check out
        if: always()
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the proof
        if: always()
        continue-on-error: true
        uses: iainchesworthlabs/icl-common-infra/actions/record-proof@62594bba592708100d459112523992fa2a736843 # v0.1.21
        with:
          needs: ${{ toJSON(needs) }}
          reused: ${{ needs.reuse.outputs.reused }}
          head-sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || '' }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}

  # After a merge: name the suspects of a group that failed. It reports and reverts nothing, and a red develop does not block
  # the queue (decision 3). It must finish before mark-green, which moves the refs it reads.
  report-red:
    name: Report red
    if: always() && github.event_name == 'push'
    needs: [reuse, build-fast, build-linux-full, build-macos, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report
        uses: iainchesworthlabs/icl-common-infra/actions/report-red@62594bba592708100d459112523992fa2a736843 # v0.1.21
        with:
          needs: ${{ toJSON(needs) }}
          reused: ${{ needs.reuse.outputs.reused }}

  # Moves refs/ci/green/<group> forward for each group that passed on this commit.
  mark-green:
    name: Mark green
    if: always() && github.event_name == 'push'
    needs: [report-red, reuse, build-fast, build-linux-full, build-macos, coverage]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mark
        uses: iainchesworthlabs/icl-common-infra/actions/mark-green@62594bba592708100d459112523992fa2a736843 # v0.1.21
        with:
          needs: ${{ toJSON(needs) }}
          reused: ${{ needs.reuse.outputs.reused }}
